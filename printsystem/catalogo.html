<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintSystem - Catálogo</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container" id="main-app">
        <header class="top-bar">
            <div class="header-logo">
                <h2>Print<span>System</span></h2>
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="index.html" style="color: inherit; text-decoration: none;">Calculadora</a></li>
                    <li class="active">Catálogo</li>
                    <li><a href="configuracoes.html" style="color: inherit; text-decoration: none;">Configurações</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="btn-logout" class="btn-logout-header">
                    <span>Sair</span>
                </button>
            </div>
        </header>

        <main class="content">
            <section id="page-catalog" class="page active">
                <h1>Catálogo de <span>Itens</span></h1>
                <div id="catalog-list" class="catalog-grid"></div>
            </section>
        </main>
    </div>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="settings.js"></script>
    <script src="catalog.js"></script>
    <script>
        async function initialize() {
            await auth.init();
            await settings.init();
            await catalog.init();
        }
        initialize();
    </script>
</body>
</html>
