<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintSystem - Configurações</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container" id="main-app">
        <header class="top-bar">
            <div class="header-logo">
                <h2>Print<span>System</span></h2>
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="index.html" style="color: inherit; text-decoration: none;">Calculadora</a></li>
                    <li><a href="catalogo.html" style="color: inherit; text-decoration: none;">Catálogo</a></li>
                    <li class="active">Configurações</li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="btn-logout" class="btn-logout-header">
                    <span>Sair</span>
                </button>
            </div>
        </header>

        <main class="content">
            <section id="page-settings" class="page active">
                <h1><span>Configurações</span></h1>
                <div class="card">
                    <div class="card-header">
                        <h2>Perfis de Custo</h2>
                        <button class="btn-icon text-icon" id="btn-add-profile">+</button>
                    </div>
                    <div id="profiles-list"></div>
                </div>
                <div class="card">
                    <h2>Custos Adicionais Globais</h2>
                    <div id="global-costs-list"></div>
                    <div class="row inline-add">
                        <input type="hidden" id="edit-global-id">
                        <input type="text" id="new-global-name" placeholder="Nome">
                        <input type="number" step="0.01" id="new-global-price" placeholder="Preço">
                        <button class="btn-primary" id="btn-add-global">Adicionar</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="settings.js"></script>
    <script>
        async function initialize() {
            await auth.init();
            await settings.init();
        }
        initialize();
    </script>
</body>
</html>
