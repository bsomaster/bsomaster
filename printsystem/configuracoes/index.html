<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintSystem - Configurações</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js" defer></script>
    <script src="../auth.js" defer></script>
    <script src="../calculator.js" defer></script>
    <script src="../settings.js" defer></script>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loader-logo">Print<span>System</span></div>
        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div class="app-container" id="main-app">
        <header class="top-bar">
            <div class="header-logo">
                <h2>Print<span>System</span></h2>
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="/printsystem/" style="color: inherit; text-decoration: none;">Dashboard</a></li>
                    <li><a href="/printsystem/meucatalogo/" style="color: inherit; text-decoration: none;">Meu Catálogo</a></li>
                    <li><a href="/printsystem/vendas/" style="color: inherit; text-decoration: none;">Minhas Vendas</a></li>
                    <li class="active">Configurações</li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="btn-logout" class="btn-logout-header">
                    <span>Sair</span>
                </button>
            </div>
        </header>

        <main class="content">
            <section id="page-settings" class="page active">
                <h1>Minhas <span>Configurações</span></h1>
                <div class="card">
                    <div class="card-header">
                        <h2>Pressets de Custo</h2>
                        <button class="btn-icon text-icon" id="btn-add-profile" title="Novo Presset">+</button>
                    </div>
                    <div id="profiles-list"></div>
                </div>
                <div class="card">
                    <h2>Custos Adicionais Globais</h2>
                    <div class="inline-add">
                        <input type="hidden" id="edit-global-id">
                        <div class="form-group">
                            <label>Nome do Custo</label>
                            <input type="text" id="new-global-name" placeholder="Ex: Embalagem">
                        </div>
                        <div class="form-group">
                            <label>Valor (R$)</label>
                            <input type="text" inputmode="decimal" id="new-global-price" class="money-input" placeholder="0.00">
                        </div>
                        <button class="btn-primary" id="btn-add-global" style="padding: 0 1.5rem;">Adicionar</button>
                    </div>
                    <div id="global-costs-list" style="margin-top: 1.5rem;"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        async function initialize() {
            try {
                await auth.init();

                // Carrega em paralelo
                await Promise.all([
                    calculator.init(),
                    settings.init()
                ]);
            } catch (err) {
                console.error("Erro na inicialização:", err);
            } finally {
                const loader = document.getElementById('loading-screen');
                if (loader) loader.classList.add('fade-out');
            }
        }
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
