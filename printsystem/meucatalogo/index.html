<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintSystem - Meu Catálogo</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js" defer></script>
    <script src="../auth.js" defer></script>
    <script src="../settings.js" defer></script>
    <script src="../calculator.js" defer></script>
    <script src="../catalog.js" defer></script>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loader-logo">Print<span>System</span></div>
        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div class="app-container" id="main-app">
        <header class="top-bar">
            <div class="header-logo">
                <h2>Print<span>System</span></h2>
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="/printsystem/" style="color: inherit; text-decoration: none;">Dashboard</a></li>
                    <li class="active">Meu Catálogo</li>
                    <li><a href="/printsystem/vendas/" style="color: inherit; text-decoration: none;">Minhas Vendas</a></li>
                    <li><a href="/printsystem/configuracoes/" style="color: inherit; text-decoration: none;">Configurações</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="btn-logout" class="btn-logout-header">
                    <span>Sair</span>
                </button>
            </div>
        </header>

        <main class="content">
            <div class="card-header">
                <h1>Meu <span>Catálogo</span></h1>
                <div class="search-container">
                    <input type="text" id="catalog-search" placeholder="Procurar item...">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20,18.5L18.5,20L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                    </svg>
                </div>
            </div>

            <section id="page-catalog" class="page active">
                <div id="catalog-list" class="catalog-grid">
                    <!-- Cards de itens aparecerão aqui -->
                </div>
            </section>
        </main>
    </div>

    <script src="../supabase.js"></script>
    <script src="../auth.js"></script>
    <script src="../settings.js"></script>
    <script src="../calculator.js"></script>
    <script src="../catalog.js"></script>
    <script>
        async function initialize() {
            try {
                await auth.init();

                // Carrega tudo em paralelo
                await Promise.all([
                    settings.init(),
                    calculator.init(),
                    catalog.init()
                ]);
            } catch (err) {
                console.error("Erro na inicialização:", err);
            } finally {
                const loader = document.getElementById('loading-screen');
                if (loader) loader.classList.add('fade-out');
            }
        }
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
