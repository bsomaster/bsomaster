    <script>
        const publicCatalog = {
            targetUserId: null,
            targetUsername: '',

            async init() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    this.targetUsername = params.get('u');

                    if (!this.targetUsername) {
                        document.getElementById('public-catalog-list').innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Usuário não especificado.</p>';
                        return;
                    }

                    document.getElementById('display-username').innerText = this.targetUsername;

                    const { data: userData, error: userError } = await window.supabase
                        .from('user_profiles')
                        .select('id')
                        .ilike('username', this.targetUsername)
                        .single();

                    if (userError || !userData) {
                        document.getElementById('public-catalog-list').innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Usuário não encontrado.</p>';
                        return;
                    }

                    this.targetUserId = userData.id;

                    const { data: items, error: itemsError } = await window.supabase
                        .from('catalog')
                        .select('*')
                        .eq('user_id', this.targetUserId)
                        .eq('is_public', true);

                    if (itemsError) throw itemsError;

                    this.render(items);
                    this.setupSearch(items);

                } catch (err) {
                    console.error(err);
                    document.getElementById('public-catalog-list').innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Erro ao carregar o catálogo.</p>';
                } finally {
                    const loader = document.getElementById('loading-screen');
                    if (loader) loader.classList.add('fade-out');
                }
            },

            render(items) {
                const container = document.getElementById('public-catalog-list');
                if (items.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Este usuário ainda não possui itens públicos.</p>';
                    return;
                }

                container.innerHTML = items.map(item => {
                    const mainPhoto = (item.photos && item.photos.length > 0) ? item.photos[0] : null;
                    return `
                        <div class="catalog-item-card" onclick="location.href='/printsystem/user/item/?u=${this.targetUsername}&id=${item.id}'" style="cursor: pointer;">
                            <div class="catalog-item-photo">
                                ${mainPhoto ? `<img src="${mainPhoto}">` : 'Sem Foto'}
                            </div>
                            <div class="catalog-item-info">
                                <div class="catalog-item-name">${item.name}</div>
                                <div class="catalog-item-prices">
                                    <div class="catalog-price-row">
                                        <span>Unitário:</span>
                                        <strong>R$ ${parseFloat(item.unit_price || 0).toFixed(2)}</strong>
                                    </div>
                                    <div class="catalog-price-row retail">
                                        <span>Atacado:</span>
                                        <strong>R$ ${parseFloat(item.wholesale_price || 0).toFixed(2)}</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            setupSearch(items) {
                const input = document.getElementById('public-search');
                input.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const filtered = items.filter(item =>
                        item.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(query)
                    );
                    this.render(filtered);
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => publicCatalog.init());
    </script>
</body>
</html>
