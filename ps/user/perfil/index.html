<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintSystem - Perfil</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase.js" defer></script>
    <style>
        .public-profile-container {
            max-width: 1400px;
            margin: 4rem auto;
            padding: 0 1rem;
        }
        .profile-layout {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .profile-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            padding: 3rem;
            text-align: center;
            position: relative;
            flex: 1;
            min-width: 320px;
            max-width: 800px;
        }
        .public-photo {
            width: 150px;
            height: 150px;
            border-radius: 5px;
            border: 4px solid var(--primary);
            margin: 0 auto 1.5rem;
            overflow: hidden;
            background: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .public-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .public-photo span {
            font-size: 4rem;
            color: var(--text-muted);
        }
        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        .profile-username {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: block;
        }
        .profile-bio {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
        }
        .contact-item:hover {
            color: var(--primary);
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        .social-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
        }
        .social-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(var(--primary-rgb), 0.3);
        }
        .social-btn svg {
            width: 24px;
            height: 24px;
        }
        .extra-sections {
            flex: 1;
            min-width: 320px;
            max-width: 800px;
            text-align: left;
        }
        .extra-card {
            background: var(--bg-card);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid var(--border);
            border-left: 4px solid var(--primary);
        }
        .extra-card h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .extra-card p {
            font-size: 0.95rem;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loader-logo">Print<span>System</span></div>
        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div class="public-profile-container" id="profile-content" style="display: none;">
        <div class="profile-layout">
            <div class="profile-card">
                <div class="public-photo">
                    <img id="view-photo" src="" style="display: none;">
                    <span id="view-placeholder">?</span>
                </div>
                <h1 class="profile-name" id="view-name">Carregando...</h1>
                <span class="profile-username" id="view-username">@username</span>

                <p class="profile-bio" id="view-bio"></p>

                <div class="contact-info">
                    <a href="#" id="view-email" class="contact-item">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4M20,18H4V8L12,13L20,8V18M12,11L4,6H20L12,11Z"/></svg>
                        <span></span>
                    </a>
                    <a href="#" id="view-phone" class="contact-item">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                        <span></span>
                    </a>
                </div>

                <div class="social-links" id="view-social"></div>
            </div>

            <div class="extra-sections" id="view-extras"></div>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="/ps/" class="text-muted" style="text-decoration: none; font-size: 0.8rem;">Powered by PrintSystem</a>
        </div>
    </div>

    <div id="error-message" style="display: none; text-align: center; margin-top: 40vh;">
        <h1>Usuário não encontrado</h1>
        <a href="/ps/" class="btn-primary" style="text-decoration: none;">Voltar para o Início</a>
    </div>

    <script>
        const socialIcons = {
            instagram: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.8,2H16.2C19.4,2 22,4.6 22,7.8V16.2C22,19.4 19.4,22 16.2,22H7.8C4.6,22 2,19.4 2,16.2V7.8C2,4.6 4.6,2 7.8,2M12,7A5,5 0 0,0 7,12A5,5 0 0,0 12,17A5,5 0 0,0 17,12A5,5 0 0,0 12,7M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M18,5.75A0.75,0.75 0 0,0 17.25,5A0.75,0.75 0 0,0 16.5,5.75A0.75,0.75 0 0,0 17.25,6.5A0.75,0.75 0 0,0 18,5.75Z"/></svg>`,
            facebook: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.9,2H3.1A1.1,1.1,0,0,0,2,3.1V20.9A1.1,1.1,0,0,0,3.1,22h9.58V14.25h-2.6v-3h2.6V9a3.64,3.64,0,0,1,3.88-4,20.26,20.26,0,0,1,2.33.12v2.7H17.3c-1.26,0-1.5.6-1.5,1.47v1.93h3l-.39,3H15.8V22h5.1A1.1,1.1,0,0,0,22,20.9V3.1A1.1,1.1,0,0,0,20.9,2Z"/></svg>`,
            twitter: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.46,6C21.69,6.35 20.86,6.58 20,6.69C20.88,6.16 21.56,5.32 21.88,4.31C21.05,4.81 20.13,5.16 19.16,5.36C18.37,4.5 17.26,4 16,4C13.65,4 11.73,5.92 11.73,8.29C11.73,8.63 11.77,8.96 11.84,9.27C8.28,9.09 5.11,7.38 3,4.79C2.63,5.42 2.42,6.16 2.42,6.94C2.42,8.43 3.17,9.75 4.33,10.5C3.62,10.48 2.96,10.28 2.38,10L2.38,10.03C2.38,12.11 3.86,13.85 5.82,14.24C5.46,14.34 5.08,14.39 4.69,14.39C4.42,14.39 4.15,14.36 3.89,14.31C4.43,16 6,17.26 7.89,17.29C6.43,18.45 4.58,19.13 2.56,19.13C2.22,19.13 1.88,19.11 1.54,19.07C3.44,20.29 5.7,21 8.12,21C16,21 20.33,14.46 20.33,8.79C20.33,8.6 20.33,8.42 20.32,8.23C21.16,7.63 21.88,6.87 22.46,6Z"/></svg>`,
            linkedin: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C13.93 9.94 13 10.63 12.59 11.24V10.13H10.13V18.5H12.59V14.26C12.59 13.13 12.79 12.05 14.18 12.05C15.56 12.05 15.6 13.33 15.6 14.34V18.5H18.5M7.07 8.11C7.88 8.11 8.54 7.45 8.54 6.64C8.54 5.83 7.88 5.17 7.07 5.17C6.26 5.17 5.6 5.83 5.6 6.64C5.6 7.45 6.26 8.11 7.07 8.11M5.84 18.5H8.29V10.13H5.84V18.5Z"/></svg>`,
            youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M 23 9.71 a 8.5 8.5 0 0 0 -0.91 -4.13 a 2.92 2.92 0 0 0 -1.72 -1 A 78.36 78.36 0 0 0 12 4.27 a 78.45 78.45 0 0 0 -8.34 0.3 a 2.87 2.87 0 0 0 -1.46 0.74 c -0.9 0.83 -1 2.25 -1.1 3.45 a 48.29 48.29 0 0 0 0 6.48 a 9.55 9.55 0 0 0 0.3 2 a 3.14 3.14 0 0 0 0.71 1.36 a 2.86 2.86 0 0 0 1.49 0.78 a 45.18 45.18 0 0 0 6.5 0.33 c 3.5 0.05 6.57 0 10.2 -0.28 a 2.88 2.88 0 0 0 1.53 -0.78 a 2.49 2.49 0 0 0 0.61 -1 a 10.58 10.58 0 0 0 0.52 -3.4 C 23 13.69 23 10.31 23 9.71 Z M 8.975 15.529 V 8.473 l 7.626 3.536 Z"/></svg>`,
            tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,2 C15.1046,2 16,2.89543 16,4 C16,5.44733 17.03,6.6618 18.3984,6.93991 C19.4808,7.15992 20.1799,8.21575 19.9599,9.29819 C19.7399,10.3806 18.6841,11.0798 17.6016,10.8598 C17.0406,10.7457 16.5037,10.5646 16,10.3252 L16,16 C16,19.3137 13.3137,22 10,22 C6.68629,22 4,19.3137 4,16 C4,13.2015 5.91407,10.8551 8.50148,10.1891 C9.57119,9.91382 10.6616,10.5578 10.9369,11.6275 C11.2122,12.6972 10.5682,13.7876 9.49852,14.0629 C8.63547,14.285 8,15.0708 8,16 C8,17.1046 8.89543,18 10,18 C11.1046,18 12,17.1046 12,16 L12,4 C12,2.89543 12.8954,2 14,2 Z"/></svg>`,
            site: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.9,17.39C17.64,16.59 16.89,16 16,16H15V13A1,1 0 0,0 14,12H8V10H10A1,1 0 0,0 11,9V7H13A2,2 0 0,0 15,5V4.59C17.93,5.77 20,8.64 20,12C20,14.08 19.2,15.97 17.9,17.39M11,19.93C7.05,19.44 4,16.08 4,12C4,11.38 4.08,10.77 4.24,10.19L7,13V14A2,2 0 0,0 9,16H10V18A1,1 0 0,0 11,19V19.93M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg>`
        };

        const socialBases = {
            instagram: 'https://www.instagram.com/',
            facebook: 'https://www.facebook.com/',
            twitter: 'https://twitter.com/',
            linkedin: 'https://www.linkedin.com/in/',
            youtube: 'https://www.youtube.com/@',
            tiktok: 'https://www.tiktok.com/@',
            site: ''
        };

        async function loadPublicProfile() {
            const params = new URLSearchParams(window.location.search);
            const username = params.get('u');

            if (!username) {
                showError();
                return;
            }

            try {
                const { data, error } = await window.supabase
                    .from('user_profiles')
                    .select('*')
                    .ilike('username', username)
                    .single();

                if (error || !data) {
                    showError();
                    return;
                }

                renderProfile(data);
            } catch (err) {
                console.error(err);
                showError();
            } finally {
                const loader = document.getElementById('loading-screen');
                if (loader) loader.classList.add('fade-out');
            }
        }

        function renderProfile(data) {
            document.getElementById('profile-content').style.display = 'block';
            document.getElementById('view-name').innerText = data.full_name || data.username;
            document.getElementById('view-username').innerText = `@${data.username}`;
            document.getElementById('view-bio').innerText = data.bio || '';

            if (data.photo_url) {
                const img = document.getElementById('view-photo');
                img.src = data.photo_url;
                img.style.display = 'block';
                document.getElementById('view-placeholder').style.display = 'none';
            }

            const email = document.getElementById('view-email');
            if (data.email_contact) {
                email.href = `mailto:${data.email_contact}`;
                email.querySelector('span').innerText = data.email_contact;
            } else {
                email.style.display = 'none';
            }

            const phone = document.getElementById('view-phone');
            if (data.phone) {
                const cleanPhone = data.phone.replace(/\D/g, '');
                phone.href = `https://wa.me/55${cleanPhone}`;
                phone.querySelector('span').innerText = data.phone;
            } else {
                phone.style.display = 'none';
            }

            const socialContainer = document.getElementById('view-social');
            socialContainer.innerHTML = '';
            (data.social_links || []).forEach(link => {
                const base = socialBases[link.platform] || '';
                const url = link.platform === 'site' && !link.username.startsWith('http') ? `https://${link.username}` : `${base}${link.username}`;

                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.className = 'social-btn';
                a.title = link.platform.charAt(0).toUpperCase() + link.platform.slice(1);
                a.innerHTML = socialIcons[link.platform] || socialIcons.site;
                socialContainer.appendChild(a);
            });

            const extrasContainer = document.getElementById('view-extras');
            extrasContainer.innerHTML = '';
            const extras = data.extra_info || [];

            if (extras.length > 0) {
                extras.forEach(info => {
                    const div = document.createElement('div');
                    div.className = 'extra-card';
                    div.innerHTML = `
                        <h3>${info.title}</h3>
                        <p>${info.content}</p>
                    `;
                    extrasContainer.appendChild(div);
                });
                extrasContainer.style.display = 'block';
            } else {
                extrasContainer.style.display = 'none';
            }
        }

        function showError() {
            document.getElementById('error-message').style.display = 'block';
            const loader = document.getElementById('loading-screen');
            if (loader) loader.classList.add('fade-out');
        }

        document.addEventListener('DOMContentLoaded', loadPublicProfile);
    </script>
</body>
</html>
